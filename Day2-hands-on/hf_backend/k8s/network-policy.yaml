apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ingress-to-hugg-backend
  namespace: retrieval-system
spec:
  podSelector:
    matchLabels:
      app: hugg-backend
  
  policyTypes:
  - Ingress

  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          name: ingress-nginx
    ports:
    - protocol: TCP
      port: 8000

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-hugg-backend-egress
  namespace: retrieval-system
spec:
  podSelector:
    matchLabels:
      app: hugg-backend
  
  policyTypes:
  - Egress

  egress:
  - to:
    - podSelector:
        matchLabels:
          app: retrieval-api
    ports:
    - protocol: TCP
      port: 8001
  
  # Allow external APIs (MongoDB Atlas, HuggingFace, Auth0, OpenAI)
  - to:
    - namespaceSelector: {}
    ports:
    - protocol: TCP
      port: 443
    - protocol: TCP
      port: 27017  # MongoDB

---
# Allow DNS queries for all pods in retrieval-system namespace
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns-retrieval-system
  namespace: retrieval-system
spec:
  podSelector: {}
  policyTypes:
  - Egress
  
  egress:
  - to:
    - namespaceSelector:
        matchLabels:
          name: kube-system
    ports:
    - protocol: UDP
      port: 53
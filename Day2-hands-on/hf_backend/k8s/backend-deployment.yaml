apiVersion: apps/v1
kind: Deployment
metadata:
  name: hugg-backend
  namespace: retrieval-system
  labels:
    app: hugg-backend
    component: backend
    version: v1.0.0

spec:
  replicas: 1

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0

  selector:
    matchLabels:
      app: hugg-backend
  
  template:
    metadata:
      labels:
        app: hugg-backend
        component: backend
        version: v1.0.0
    
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app
                  operator: In
                  values:
                  - hugg-backend
              topologyKey: kubernetes.io/hostname
      
      # Security context
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      
      containers:
      - name: backend
        image: sakshitayal712/hf_backend:latest
        imagePullPolicy: Always

        ports:
        - containerPort: 8000
          name: http
          protocol: TCP
        
        envFrom:
        - configMapRef:
            name: hugg-backend-config

        env:
        - name: MONGO_URI
          valueFrom:
            secretKeyRef:
              name: hugg-backend-secrets
              key: MONGO_URI
        - name: AUTH0_DOMAIN
          valueFrom:
            secretKeyRef:
              name: hugg-backend-secrets
              key: AUTH0_DOMAIN
        - name: AUTH0_AUDIENCE
          valueFrom:
            secretKeyRef:
              name: hugg-backend-secrets
              key: AUTH0_AUDIENCE
        - name: CLIENT_ID
          valueFrom:
            secretKeyRef:
              name: hugg-backend-secrets
              key: CLIENT_ID
        - name: CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: hugg-backend-secrets
              key: CLIENT_SECRET
        - name: AUDIENCE
          valueFrom:
            secretKeyRef:
              name: hugg-backend-secrets
              key: AUDIENCE
        - name: HF_TOKEN
          valueFrom:
            secretKeyRef:
              name: hugg-backend-secrets
              key: HF_TOKEN
        
        resources:
          requests:
            cpu: "500m"
            memory: "1Gi"
          limits:
            cpu: "2000m"
            memory: "4Gi"
        
        # Health checks
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
            scheme: HTTP
          initialDelaySeconds: 60
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
            scheme: HTTP
          initialDelaySeconds: 30
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        
        startupProbe:
          httpGet:
            path: /health
            port: 8000
            scheme: HTTP
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 12
        
        # Container level security group
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: false
          capabilities:
            drop:
            - ALL
      
      restartPolicy: Always
      dnsPolicy: ClusterFirst
      terminationGracePeriodSeconds: 30
        


apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: retrieval-system-yaml
  labels:
    app: postgres
    component: database
spec:
  # Service name for stable DNS entries
  serviceName: postgres-headless
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
        component: database
    spec:
      # Security context for the pod
      securityContext:
        fsGroup: 999 # ← PostgreSQL user ID

      containers:
      - name: postgres
        image: pgvector/pgvector:pg16

        ports:
        - containerPort: 5432
          name: postgres
          protocol: TCP
        
        env:
          - name: POSTGRES_DB
            valueFrom:
              configMapKeyRef:
                name: retrieval-config
                key: POSTGRES_DB
          - name: POSTGRES_USER
            valueFrom:
              configMapKeyRef:
                name: retrieval-config
                key: POSTGRES_USER
          - name: POSTGRES_PASSWORD
            valueFrom:
              secretKeyRef:
                name: retrieval-secrets
                key: POSTGRES_PASSWORD
          - name: PGDATA
            value: /var/lib/postgresql/data/pgdata_v1

        volumeMounts:
        - name: postgres-storage
          mountPath: /var/lib/postgresql/data

        - name: init-scripts
          mountPath: /docker-entrypoint-initdb.d
          readOnly: true
        
        resources:
          requests:
            cpu: "500m"
            memory: "1Gi"
          limits:
            cpu: "2000m"     
            memory: "4Gi"

        livenessProbe:
          exec:
            command:
            - /bin/sh
            - -c
            - pg_isready -U $POSTGRES_USER -d $POSTGRES_DB
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        
        readinessProbe:
          exec:
            command:
            - /bin/sh
            - -c
            - pg_isready -U $POSTGRES_USER -d $POSTGRES_DB
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        
        startupProbe:
          exec:
            command:
            - /bin/sh
            - -c
            - pg_isready -U $POSTGRES_USER -d $POSTGRES_DB
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 30
    
      # Volumes
      volumes:
      - name: postgres-storage
        persistentVolumeClaim:
          claimName: postgres-pvc
        
      - name: init-scripts
        configMap:
          name: postgres-init-scripts
          optional: true

        
    





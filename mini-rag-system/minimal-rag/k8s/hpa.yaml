apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: retrieval-api-hpa
  namespace: retrieval-system
  labels:
    app: retrieval-api
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: retrieval-api

  minReplicas: 2
  maxReplicas: 10

  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300  # ← Wait 5 minutes before scaling down
      policies:
      - type: Percent
        value: 50  # ← Scale down max 50% at a time
        periodSeconds: 60
      - type: Pods
        value: 2  # ← Scale down max 2 pods at a time
        periodSeconds: 60
      selectPolicy: Min  # ← Use the most conservative policy

    scaleUp:
      stabilizationWindowSeconds: 0  # ← Scale up immediately
      policies:
      - type: Percent
        value: 100  # ← Scale up max 100% at a time (double pods)
        periodSeconds: 15
      - type: Pods
        value: 4  # ← Scale up max 4 pods at a time
        periodSeconds: 15
      selectPolicy: Max  # ← Use the most aggressive policy

  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70  # ← Scale when average CPU > 70%
  
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80  # ← Scale when average memory > 80%

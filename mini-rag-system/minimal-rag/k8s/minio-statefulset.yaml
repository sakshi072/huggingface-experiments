apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: minio
  namespace: retrieval-system
  labels:
    app: minio
    component: storage
spec:
  serviceName: minio-headless
  replicas: 1

  selector:
    matchLabels:
      app: minio
  template:
    metadata:
      labels:
        app: minio
        component: storage
    
    spec:

      # Security context
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000

      containers:
        - name: minio
          image: minio/minio:latest

          args:
          - server
          - /data
          - --console-address
          - ":9001"

          ports:
          - containerPort: 9000
            name: api
            protocol: TCP
          - containerPort: 9001
            name: console
            protocol: TCP
        
          env:
          - name: MINIO_ROOT_USER
            valueFrom:
              secretKeyRef:
                name: retrieval-secrets
                key: MINIO_ROOT_USER
          - name: MINIO_ROOT_PASSWORD
            valueFrom:
              secretKeyRef:
                name: retrieval-secrets
                key: MINIO_ROOT_PASSWORD
          
          volumeMounts:
          - name: minio-storage
            mountPath: /data
          
          # Resource limits
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "2Gi"
          
          # Health checks
          livenessProbe:
            httpGet:
              path: /minio/health/live
              port: 9000
              scheme: HTTP
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          
          readinessProbe:
            httpGet:
              path: /minio/health/ready
              port: 9000
              scheme: HTTP
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
            
      volumes:
        - name: minio-storage
          persistentVolumeClaim:
            claimName: minio-pvc
            
        
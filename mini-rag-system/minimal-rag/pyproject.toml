# pyproject.toml - Minimal RAG System (Phase 1)
[tool.poetry]
name = "mini-rag"
version = "0.1.0"
description = "Minimal RAG system - learning step by step"
authors = ["Sakshi Tayal"]
package-mode = false

[tool.poetry.dependencies]
python = "^3.12"

# Text processing
langchain-text-splitters = "^0.0.1"
tiktoken = ">=0.8.0"

# Vector database - Local, no Docker needed yet

numpy = "<2.0.0"

# Embeddings 
sentence-transformers = "^3.0.0"
requests = "^2.31.0"

# Utilities
python-dotenv = "^1.0.0"
openai = "^2.14.0"
aiohttp = "^3.9.0"
pydantic-settings = "^2.0.0"

# FastAPI 
fastapi = "^0.109.0"
uvicorn = {extras = ["standard"], version = "^0.27.0"}
python-multipart = "^0.0.6"  # For file uploads

# Document parsing
pypdf = "^3.17.0"
pdfplumber = "^0.10.0"
python-docx = "^1.1.0"
asyncpg = "^0.31.0"
sqlalchemy = "^2.0.45"
pgvector = "^0.4.2"
minio = "^7.2.20"
greenlet = "^3.3.0"
python-jose = {version = "^3.5.0", extras = ["cryptography"]}
gunicorn = "^23.0.0"
redis = "^7.1.0"
cachetools = "^7.0.1"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
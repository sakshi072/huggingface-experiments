# pyproject.toml - Minimal RAG System (Phase 1)
[tool.poetry]
name = "mini-rag"
version = "0.1.0"
description = "Minimal RAG system - learning step by step"
authors = ["Sakshi Tayal"]
package-mode = false

[tool.poetry.dependencies]
python = "^3.12"

# Text processing
langchain-text-splitters = "^0.0.1"
tiktoken = ">=0.8.0"

# Vector database - Local, no Docker needed yet
chromadb = "^0.4.22"

numpy = "<2.0.0"

# Embeddings & LLM - HuggingFace free API
sentence-transformers = "^2.3.0"
requests = "^2.31.0"

huggingface-hub = "^0.20.0"

# Utilities
python-dotenv = "^1.0.0"
openai = "^2.14.0"

# FastAPI 
fastapi = "^0.109.0"
uvicorn = {extras = ["standard"], version = "^0.27.0"}
python-multipart = "^0.0.6"  # For file uploads

# Document parsing
pypdf = "^3.17.0"
pdfplumber = "^0.10.0"
python-docx = "^1.1.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
# Global Settings
global:
  environment: development
  namespace: retrieval-system

# API service configuration
api:
  replicaCount: 1
  
  image:
    repository: sakshitayal712/mini_rag
    tag: "mini_rag-e879c9c"
    pullPolicy: Always

  service:
    type: ClusterIP
    port: 8001
    targetPort: 8001

  resources:
    requests:
      cpu: "500m"
      memory: "1Gi"
    limits:
      cpu: "2000m"
      memory: "4Gi"
  
  # Health check configuration
  livenessProbe:
    enabled: true
    initialDelaySeconds: 60
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3
  
  readinessProbe:
    enabled: true
    initialDelaySeconds: 30
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 3
  
  startupProbe:
    enabled: true
    initialDelaySeconds: 10
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 12

# PostgreSQL Configuration
postgresql:
  enabled: true

  image:
    repository: pgvector/pgvector
    tag: "pg16"
    pullPolicy: IfNotPresent
  
  service:
    type: ClusterIP
    port: 5432
  
  persistence:
    enabled: true
    size: 10Gi
    storageClass: ""

  resources:
    requests:
      cpu: "500m"
      memory: "1Gi"
    limits:
      cpu: "2000m"
      memory: "4Gi"
  
  database:
    name: retrieval_db
    user: rag_user

# MinIO Configuration
minio:
  enabled: true

  image:
    repository: minio/minio
    tag: "latest"
    pullPolicy: IfNotPresent
  
  service:
    type: ClusterIP
    apiPort: 9000
    consolePort: 9001
  
  persistence:
    enabled: true
    size: 50Gi
    storageClass: ""
  
  resources:
    requests:
      cpu: "250m"
      memory: "512Mi"
    limits:
      cpu: "1000m"
      memory: "2Gi"
  
  # MinIO configuration
  bucket: document-storage

# Redis Configuration
redis:
  enabled: true

  image:
    repository: redis
    tag: "7-alpine"
    pullPolicy: IfNotPresent
  
  service:
    type: ClusterIP
    port: 6379
  
  resources:
    requests:
      cpu: "100m"
      memory: "256Mi"
    limits:
      cpu: "500m"
      memory: "512Mi"
  
  maxmemory: "512mb"
  maxmemoryPolicy: "allkeys-lru"

# Application Configuration
config:
  
  env: development
  debug: false

  embedding:
    model: "sentence-transformers/all-MiniLM-L6-v2"
    chunkingStrategy: "recursive_split"
    chunkSize: "512"
    chunkOverlap: "50"
  
  rerank:
    strategy: "combined"
    qualityWeight: "0.2"
    alpha: "0.7"
    lambda: "0.5"
    maxChunksPerDoc: "2"
  
  features:
    semanticChunking: "false"
    reranking: "false"
    rerankMultiplier: "3"

# Secrets Configuration
secrets:
  postgresql:
    password: "postgres_password"
  minio:
    rootUser: "minio_root_user"
    rootPassword: "minio_root_password"
  auth0:
    domain: "auth0-domain"
    audience: "auth0_adience"

# Horizontal Pod Autoscalar
autoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 10

  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 50
          periodSeconds: 60
        - type: Pods
          value: 2
          periodSeconds: 60
    
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
        - type: Percent
          value: 100
          periodSeconds: 15
        - type: Pods
          value: 4
          periodSeconds: 15
  
  metrics:
    cpu: 
      enabled: true
      targetAverageUtilization: 70
    
    memory:
      enabled: true
      targetAverageUtilization: 80

# Ingress Configuration
ingress:
  enabled: true
  className: nginx

  annotations:
    nginx.ingress.kubernetes.io/enable-cors: "true"
    nginx.ingress.kubernetes.io/cors-allow-origin: "*"
    nginx.ingress.kubernetes.io/cors-allow-methods: "GET, POST, PUT, OPTIONS, DELETE"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "120"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "120"
    nginx.ingress.kubernetes.io/limit-rps: "100"
    # cert-manager.io/cluster-issuer: "letsencrypt-prod"

  hosts:
    - host: retrieval.local
      paths:
        - path: /
          pathType: Prefix
    
    - host: minio.local
      paths:
        - path: /
          pathType: Prefix
          service: minio
          port: 9001
    
  tls: []

# Network Policy
networkPolicy:
  enabled: true

  policyTypes:
    - Ingress
    - Egress
  
  allowDNS: true

# Service Account
serviceAccount:
  create: true
  annotations: {}
  name: ""

# Pod Security
podSecurityContent:
  runAsNonRoot: true
  runAsUser: 1000
  fsGroup: 1000

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: false
  capabilities:
    drop:
      - ALL

# Node Selection
nodeSelector: {}

tolerations: []

affinity:
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
    - weight: 100
      podAffinityTerm:
        labelSelector:
          matchExpressions:
            - key: app
              operator: In
              values:
              - retrieval-api
      
        topologyKey: kubernetes.io/hostname
{{- if .Values.minio.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: minio-headless
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "retrieval-system.minio.labels" . | nindent 4 }}

spec:
  type: ClusterIP
  clusterIP: None

  ports:
  - port: {{ .Values.minio.service.apiPort }}
    targetPort: {{ .Values.minio.service.apiPort }}
    protocol: TCP
    name: api
  
  - port: {{ .Values.minio.service.consolePort }}
    targetPort: {{ .Values.minio.service.consolePort }}
    protocol: TCP
    name: console

  selector:
    {{- include "retrieval-system.minio.selectorLabels" . | nindent 4 }}
{{- end }}
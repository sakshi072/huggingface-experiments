{{- if .Values.redis.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "retrieval-system.redis.labels" . | nindent 4 }}

spec:
  replicas: 1

  selector:
    matchLabels:
      {{- include "retrieval-system.redis.selectorLabels" . | nindent 6 }}
  
  template:
    metadata:
      labels:
        {{- include "retrieval-system.redis.labels" . | nindent 8 }}

    spec:
      containers:
      - name: redis
        image: "{{ .Values.redis.image.repository }}:{{ .Values.redis.image.tag }}"
        imagePullPolicy: {{ .Values.redis.image.pullPolicy }}

        ports:
        - containerPort: {{ .Values.redis.service.port }}
          name: redis
          protocol: TCP

        command:
        - redis-server
        - --maxmemory
        - {{ .Values.redis.maxmemory | quote }}
        - --maxmemory-policy
        - {{ .Values.redis.maxmemoryPolicy | quote }}
        - --save
        - ""

        {{- with .Values.redis.resources }}
        resources:
          {{- toYaml . | nindent 10 }}
        {{- end }}
        
        livenessProbe:
          exec:
            command:
            - redis-cli
            - ping
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3

        readinessProbe:
          exec:
            command:
            - redis-cli
            - ping
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
{{- end }}
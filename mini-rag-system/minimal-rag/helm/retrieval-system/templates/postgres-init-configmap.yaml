{{- if .Values.postgresql.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init-scripts
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "retrieval-system.postgres.labels" . | nindent 4 }}
data:
  # Scripts run in alphabetical order, so we prefix with numbers
  01-create-user.sql: |
    -- Create application user
    CREATE USER {{ .Values.postgresql.database.user }} WITH PASSWORD '{{ .Values.secrets.postgresql.password }}';

    -- Grant privileges on database
    GRANT ALL PRIVILEGES ON DATABASE {{ .Values.postgresql.database.name }} TO {{ .Values.postgresql.database.user }};

    -- Grant schema permissions
    GRANT ALL PRIVILEGES ON SCHEMA public TO {{ .Values.postgresql.database.user }};

    -- Grant permissions on all existing tables
    GRANT ALL PRIVILEGES ON ALL TABLES IN SCHEMA public TO {{ .Values.postgresql.database.user }};
    GRANT ALL PRIVILEGES ON ALL SEQUENCES IN SCHEMA public TO {{ .Values.postgresql.database.user }};

    -- Grant permissions on future tables
    ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT ALL ON TABLES TO {{ .Values.postgresql.database.user }};
    ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT ALL ON SEQUENCES TO {{ .Values.postgresql.database.user }};

  02-init-schema.sql: |
    -- Enable pgvector extension (requires superuser)
    CREATE EXTENSION IF NOT EXISTS vector;
    CREATE EXTENSION IF NOT EXISTS "uuid-ossp";

    -- Domain/Tenant table
    CREATE TABLE IF NOT EXISTS domains (
        id UUID PRIMARY KEY DEFAULT uuid_generate_v4(),
        name VARCHAR(100) NOT NULL UNIQUE,
        description TEXT,
        embedding_model VARCHAR(100) DEFAULT 'sentence-transformers/all-MiniLM-L6-v2',
        chunk_size INTEGER DEFAULT 512,
        chunk_overlap INTEGER DEFAULT 50,
        metadata JSONB DEFAULT '{}',
        min_similarity_threshold FLOAT DEFAULT 0.5,
        created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP
    );

    -- Insert default domains
    INSERT INTO domains (name, description, min_similarity_threshold) VALUES
    ('general', 'General knowledge base', 0.5),
    ('medical', 'Healthcare and medical documentation', 0.7),
    ('legal', 'Legal documents and contracts', 0.75),
    ('technical', 'Technical documentation and code', 0.65),
    ('finance', 'Financial reports and analysis', 0.75)
    ON CONFLICT (name) DO NOTHING;

    -- Documents table
    CREATE TABLE IF NOT EXISTS documents (
        id UUID PRIMARY KEY DEFAULT uuid_generate_v4(),
        domain_id UUID NOT NULL REFERENCES domains(id) ON DELETE RESTRICT,
        filename VARCHAR(255) NOT NULL,
        file_type VARCHAR(10) NOT NULL,
        file_size INTEGER NOT NULL,
        file_hash VARCHAR(64) NOT NULL,
        minio_object_key VARCHAR(500) NOT NULL UNIQUE,
        status VARCHAR(20) NOT NULL DEFAULT 'processing',
        chunk_count INTEGER DEFAULT 0,
        error_message TEXT,
        avg_chunk_quality FLOAT,
        processing_version VARCHAR(20),
        metadata JSONB DEFAULT '{}',
        owner_id VARCHAR(255),
        is_public BOOLEAN DEFAULT false,
        created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP,
        CONSTRAINT valid_status CHECK (status IN ('processing', 'completed', 'failed')),
        CONSTRAINT valid_file_type CHECK (file_type IN ('pdf', 'docx', 'txt', 'md'))
    );

    -- Document chunks table
    CREATE TABLE IF NOT EXISTS document_chunks (
        id UUID PRIMARY KEY DEFAULT uuid_generate_v4(),
        document_id UUID NOT NULL REFERENCES documents(id) ON DELETE CASCADE,
        domain_id UUID NOT NULL REFERENCES domains(id) ON DELETE RESTRICT,
        chunk_index INTEGER NOT NULL,
        text TEXT NOT NULL,
        embedding vector(384) NOT NULL,
        chunk_type VARCHAR(50),
        semantic_density FLOAT,
        key_entities JSONB,
        keywords TEXT[],
        page_number INTEGER,
        section_title TEXT,
        token_count INTEGER,
        quality_score FLOAT,
        created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP,
        UNIQUE(document_id, chunk_index)
    );

    -- Search Analytics table
    CREATE TABLE IF NOT EXISTS search_analytics (
        id UUID PRIMARY KEY DEFAULT uuid_generate_v4(),
        query_text TEXT NOT NULL,
        result_chunk_ids UUID[],
        similarity_scores FLOAT[],
        embedding_time_ms FLOAT,
        search_time_ms FLOAT,
        total_processing_time FLOAT,
        is_cached BOOLEAN DEFAULT false,
        created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP
    );

    -- Indexes for performance
    CREATE INDEX IF NOT EXISTS idx_documents_domain ON documents(domain_id);
    CREATE INDEX IF NOT EXISTS idx_documents_owner ON documents(owner_id) WHERE owner_id IS NOT NULL;
    CREATE INDEX IF NOT EXISTS idx_documents_status ON documents(status);
    CREATE INDEX IF NOT EXISTS idx_documents_hash ON documents(file_hash);
    CREATE INDEX IF NOT EXISTS idx_documents_filename ON documents(filename);

    CREATE INDEX IF NOT EXISTS idx_chunks_domain ON document_chunks(domain_id);
    CREATE INDEX IF NOT EXISTS idx_chunks_document ON document_chunks(document_id);
    CREATE INDEX IF NOT EXISTS idx_chunks_metadata_filter ON document_chunks (domain_id, document_id);

    -- Vector similarity index (HNSW)
    CREATE INDEX IF NOT EXISTS idx_chunks_embedding ON document_chunks
    USING hnsw (embedding vector_cosine_ops)
    WITH (m = 16, ef_construction = 64);
{{- end }}

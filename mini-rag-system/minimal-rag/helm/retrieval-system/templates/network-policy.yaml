{{- if .Values.networkPolicy.enabled }}
---
# Default deny all ingress traffic
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "retrieval-system.labels" . | nindent 4 }}
spec:
  podSelector: {}
  policyTypes:
  - Ingress

---
# Allow API pods to receive traffic from Ingress
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ingress-to-api
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "retrieval-system.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "retrieval-system.api.selectorLabels" . | nindent 6 }}
  
  policyTypes:
  - Ingress

  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          name: ingress-nginx
    ports:
    - protocol: TCP
      port: {{ .Values.api.service.targetPort }}

---
# Allow API to access PostgreSQL
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-api-to-postgres
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "retrieval-system.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "retrieval-system.postgres.selectorLabels" . | nindent 6 }}
  
  policyTypes:
  - Ingress

  ingress:
  - from:
    - podSelector:
        matchLabels:
          {{- include "retrieval-system.api.selectorLabels" . | nindent 10 }}
    ports:
    - protocol: TCP
      port: {{ .Values.postgresql.service.port }}

---
# Allow API to access MinIO
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-api-to-minio
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "retrieval-system.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "retrieval-system.minio.selectorLabels" . | nindent 6 }}
  
  policyTypes:
  - Ingress

  ingress:
  - from:
    - podSelector:
        matchLabels:
          {{- include "retrieval-system.api.selectorLabels" . | nindent 10 }}
    ports:
    - protocol: TCP
      port: {{ .Values.minio.service.apiPort }}

  - from:
    - namespaceSelector:
        matchLabels:
          name: ingress-nginx
    ports:
    - protocol: TCP
      port: {{ .Values.minio.service.consolePort }}

---
# Allow API to access Redis
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-api-to-redis
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "retrieval-system.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "retrieval-system.redis.selectorLabels" . | nindent 6 }}
  
  policyTypes:
  - Ingress

  ingress:
  - from:
    - podSelector:
        matchLabels:
          {{- include "retrieval-system.api.selectorLabels" . | nindent 10 }}
    ports:
    - protocol: TCP
      port: {{ .Values.redis.service.port }}

{{- if .Values.networkPolicy.allowDNS }}
---
# Allow DNS queries
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "retrieval-system.labels" . | nindent 4 }}
spec:
  podSelector: {}
  policyTypes:
  - Egress
  
  egress:
  - to:
    - namespaceSelector:
        matchLabels:
          name: kube-system
    ports:
    - protocol: UDP
      port: 53
{{- end }}
{{- end }}
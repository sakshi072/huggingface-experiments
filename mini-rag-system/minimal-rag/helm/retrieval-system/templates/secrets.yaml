apiVersion: v1
kind: Secret
metadata:
    name: retrieval-secrets
    namespace: {{ .Values.global.namespace }}
    labels:
        {{- include "retrieval-system.labels" . | nindent 4 }}
type: Opaque
data:
    # IMPORTANT: These values should be base64 encoded
    POSTGRES_PASSWORD: {{ .Values.secrets.postgresql.password | b64enc | quote }}
    MINIO_ROOT_USER: {{ .Values.secrets.minio.rootUser | b64enc | quote }}
    MINIO_ROOT_PASSWORD: {{ .Values.secrets.minio.rootPassword | b64enc | quote }}
    AUTH0_DOMAIN: {{ .Values.secrets.auth0.domain | b64enc | quote }}
    AUTH0_AUDIENCE: {{ .Values.secrets.auth0.audience | b64enc | quote }}
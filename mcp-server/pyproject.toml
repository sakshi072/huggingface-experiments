[project]
name = "mcp-server"
version = "0.1.0"
description = ""
authors = [
    {name = "stayal2",email = "sakshitayal712@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.12,<4.0"
dependencies = [
    "mcp[cli] (>=1.26.0,<2.0.0)",
    "httpx (>=0.28.1,<0.29.0)",
    "pydantic-settings (>=2.12.0,<3.0.0)",
    "uvicorn (>=0.40.0,<0.41.0)",
    "gunicorn>=21.2.0,<22.0.0",
    "fastmcp (>=3.0.2,<4.0.0)"
]

[tool.poetry]
packages = [{include = "mcp_server", from = "src"}]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
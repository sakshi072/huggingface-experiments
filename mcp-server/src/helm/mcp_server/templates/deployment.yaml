apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcp-server
  namespace: {{ .Values.global.namespace}}
  labels:
    {{- include "mcp_server.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0

  selector:
    matchLabels:
      {{- include "mcp_server.server.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "mcp_server.server.labels" . | nindent 8 }}
        version: {{ .Chart.AppVersion }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        checksum/secret: {{ include (print $.Template.BasePath "/secrets.yaml") . | sha256sum }}

    spec:
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}

      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}

      containers:
        - name: mcp-server
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}

          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}

          ports:
            - name: http
              containerPort: {{ .Values.service.targetPort }}
              protocol: TCP

          envFrom:
          - configMapRef:
              name: mcp-server-config
          
          env:
          - name: AUTH0_DOMAIN
            valueFrom:
              secretKeyRef:
                name: mcp-server-secrets
                key: AUTH0_DOMAIN
          - name: AUTH0_AUDIENCE
            valueFrom:
              secretKeyRef:
                name: mcp-server-secrets
                key: AUTH0_AUDIENCE
          - name: AUTH0_CLIENT_ID
            valueFrom:
              secretKeyRef:
                name: mcp-server-secrets
                key: AUTH0_CLIENT_ID
          - name: AUTH0_CLIENT_SECRET
            valueFrom:
              secretKeyRef:
                name: mcp-server-secrets
                key: AUTH0_CLIENT_SECRET
          - name: AUTH0_LANGCHAIN_CLIENT_DOMAIN
            valueFrom:
              secretKeyRef:
                name: mcp-server-secrets
                key: AUTH0_LANGCHAIN_CLIENT_DOMAIN
          - name: AUTH0_LANGCHAIN_CLIENT_AUDIENCE
            valueFrom:
              secretKeyRef:
                name: mcp-server-secrets
                key: AUTH0_LANGCHAIN_CLIENT_AUDIENCE
          - name: TLS_CA_CERT
            value: "/etc/mcp/certs/ca.crt"
          - name: TLS_SERVER_CERT
            value: "/etc/mcp/certs/tls.crt"
          - name: TLS_SERVER_KEY
            value: "/etc/mcp/certs/tls.key"
          - name: RETRIEVAL_TLS_CA_CERT
            value: "/etc/retrieval/client-certs/ca.crt"
          - name: RETRIEVAL_TLS_CLIENT_CERT
            value: "/etc/retrieval/client-certs/tls.crt"
          - name: RETRIEVAL_TLS_CLIENT_KEY
            value: "/etc/retrieval/client-certs/tls.key"

          {{- if .Values.livenessProbe.enabled }}
          livenessProbe:
            httpGet:
              path: /health
              port: {{ .Values.service.targetPort }}
              scheme: HTTPS
            initialDelaySeconds: {{ .Values.livenessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.livenessProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.livenessProbe.timeoutSeconds }}
            failureThreshold: {{ .Values.livenessProbe.failureThreshold }}
          {{- end }}

          {{- if .Values.readinessProbe.enabled }}
          readinessProbe:
            httpGet:
              path: /health
              port: {{ .Values.service.targetPort }}
              scheme: HTTPS
            initialDelaySeconds: {{ .Values.readinessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.readinessProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.readinessProbe.timeoutSeconds }}
            failureThreshold: {{ .Values.readinessProbe.failureThreshold }}
          {{- end }}

          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}

          {{- with .Values.volumeMounts }}
          volumeMounts:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      
      restartPolicy: Always
      dnsPolicy: ClusterFirst
      terminationGracePeriodSeconds: 30

      {{- with .Values.volumes }}
      volumes:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}

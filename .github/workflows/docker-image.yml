name: Docker Image CI
on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop
env:
  REGISTRY: docker.io
jobs:
  # Detect changes for all services
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      # Output which services changed as JSON array
      services: ${{ steps.filter.outputs.changes }}
    steps:
    - uses: actions/checkout@v4
    - uses: dorny/paths-filter@v2
      id: filter
      with:
        filters: |
          single_agent_backend:
            - 'Day2-hands-on/hf_backend/**'
          single_agent_frontend:
            - 'Day2-hands-on/hf-frontend/**'
          mini_rag:
            - 'mini-rag-system/**'
          multi_agent_backend:
            - 'Multi-Agent-Chat-System/agent-service/**'
          multi_agent_frontend:
            - 'Multi-Agent-Chat-System/chat-ui/**'
            
  # Build all changed services using matrix strategy
  build-services:
    needs: detect-changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        # Define all services here
        service:
          - name: single_agent_backend
            context: ./Day2-hands-on/hf_backend
            dockerfile: ./Day2-hands-on/hf_backend/Dockerfile
          - name: single_agent_frontend
            context: ./Day2-hands-on/hf-frontend
            dockerfile: ./Day2-hands-on/hf-frontend/Dockerfile
          - name: mini_rag
            context: ./mini-rag-system/minimal-rag
            dockerfile: ./mini-rag-system/minimal-rag/Dockerfile
          - name: multi_agent_backend
            context: ./Multi-Agent-Chat-System/agent-service
            dockerfile: ./Multi-Agent-Chat-System/agent-service/Dockerfile
          - name: multi_agent_frontend
            context: ./Multi-Agent-Chat-System/chat-ui
            dockerfile: ./Multi-Agent-Chat-System/chat-ui/Dockerfile
    
    steps: 
      - name: Free up disk space
        if: contains(needs.detect-changes.outputs.services, matrix.service.name)
        run: |
          echo "=== Disk space before cleanup ==="
          df -h
          echo "=== Removing unnecessary files ==="
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo docker system prune -af --volumes
          echo "=== Disk space after cleanup ==="
          df -h
      - name: Check Disk Space
        run: df -h
      - name: Checkout
        if: contains(needs.detect-changes.outputs.services, matrix.service.name)
        uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        if: contains(needs.detect-changes.outputs.services, matrix.service.name)
        uses: docker/setup-buildx-action@v3
        
      - name: Log in to Docker Hub
        if: |
          contains(needs.detect-changes.outputs.services, matrix.service.name) && 
          github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          
      - name: Extract metadata
        if: contains(needs.detect-changes.outputs.services, matrix.service.name)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.service.name }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=sha,prefix=${{ matrix.service.name }}-
            type=raw,value=latest,enable={{is_default_branch}}
            
      - name: Build and push - ${{ matrix.service.name }}
        if: contains(needs.detect-changes.outputs.services, matrix.service.name)
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.service.context }}
          file: ${{ matrix.service.dockerfile }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          
      - name: Cleanup after build
        if: contains(needs.detect-changes.outputs.services, matrix.service.name)
        run: |
          docker system prune -f
          df -h    
          
      - name: Build Summary
        if: contains(needs.detect-changes.outputs.services, matrix.service.name)
        run: |
          echo "### ✅ ${{ matrix.service.name }} - Build Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Context:** \`${{ matrix.service.context }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Dockerfile:** \`${{ matrix.service.dockerfile }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Pull Command:**" >> $GITHUB_STEP_SUMMARY
          echo '```bash' >> $GITHUB_STEP_SUMMARY
          echo "docker pull ${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.service.name }}:latest" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
